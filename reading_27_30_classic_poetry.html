          "5": "해설 확인 필요"
        },
        "trapType": "AI 분류 필요"
      },
      "pdfPage": 11
    }
  ],
  "submissionConfig": {
    "mode": "google",
    "teacherEmail": "",
    "googleScriptUrl": "https://script.google.com/macros/s/AKfycbwbVvkHed35wCaD19SC2aTsTChRIz449k9bqbRCdzCgj4hPZdSCcN1EwhoUH8_CGqM/exec",
    "googleDrivePdfUrl": ""
  }
};
const STORAGE_KEY = "wrongnote:" + DATA.meta.passageId;
const PENDING_KEY = "wrongnote:pending:" + DATA.meta.passageId;
const HIGHLIGHT_KEY = STORAGE_KEY + ":highlights";
let currentHighlightColor = "yellow";
let savedHighlightRange = null;
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function prose(s) { return esc(s).replace(/\r?\n/g, " ").replace(/\s+/g, " ").trim(); }
function applyUnderline(html) { return String(html ?? "").replace(/([㉠-㉿ⓐ-ⓩ㉮-㉻])([가-힣a-zA-Z0-9·]+)/g, '$1<u>$2</u>'); }
function applySectionLabels(html) {
  html = String(html ?? "");
  html = html.replace(/\[([A-Z])\]/g, '<span class="section-label">[$1]</span>');
  html = html.replace(/\[([가-힣][가-힣\s\d]*)\]/g, '<span class="concept-label">[$1]</span>');
  return html;
}
function choiceSymbol(n) { return ["①","②","③","④","⑤"][Number(n)-1] || n; }
function sectionSlug(meta) {
  const id = String(meta?.passageId || "");
  return id.startsWith("set_") ? id.split("_").slice(3).join("_") : "";
}
function sectionName(meta) {
  const slug = sectionSlug(meta);
  return slug ? `${meta.section} [${slug}]` : meta.section;
}
function sourceText(value) {
  const v = String(value ?? "").trim();
  return v && v !== "확인 필요" ? v : "수능 출제 지문(원전 미표기)";
}
function renderMeta() {
  const m = DATA.meta;
  $("title").textContent = `${m.examName} | ${m.subject} ${sectionName(m)} (${m.questionRange})`;
  $("meta").innerHTML = [
    ["시험일", m.examDate], ["영역", `${m.subject} / ${sectionName(m)}`],
    ["문항 범위", m.questionRange], ["글/작품", m.sourceTitle],
    ["출전", sourceText(m.source)]
  ].map(([k,v]) => `<div><span class="meta-label">${esc(k)}:</span><span class="meta-value">${esc(v)}</span></div>`).join("");
  $("today").value ||= new Date().toISOString().slice(0,10);
}
function renderPassages() {
  $("passages").innerHTML = DATA.passages.map((p, idx) => `
    <article class="passage-card">
      ${p.label ? `<span class="passage-label">${esc(p.label)}</span>` : ""}
      <div class="passage-title">${esc(p.title)}</div>
      <div class="passage-source">출전: ${esc(sourceText(p.source || DATA.meta.source))}</div>
      <div class="passage-box markable" data-highlight-id="passage-${idx}">${p.paragraphs.map(x => {
        const text = esc(x.text);
        const sec = DATA.meta.section || "";
        const isPoetry = sec.includes("시") || sec.includes("가") || sec.includes("수필") || sec.includes("갈래");
        const processed = isPoetry ? text : text.replace(/\r?\n/g, " ").replace(/\s+/g, " ");
        return applySectionLabels(applyUnderline(processed));
      }).join("\n\n")}</div>
      <div class="passage-reflection">
        <label>지문 난이도</label>
        <div class="difficulty-row">
          ${["쉬움","중간","어려움","매우 어려움"].map(level => `
            <label><input type="radio" name="passage-difficulty-${idx}" data-passage-difficulty="${idx}" value="${level}"> ${level}</label>
          `).join("")}
        </div>
        <div class="reflection-grid">
          <div><label>어려웠던 점</label><textarea data-passage-note="${idx}-difficulty"></textarea></div>
          <div><label>느낀 점</label><textarea data-passage-note="${idx}-feeling"></textarea></div>
          <div><label>몰랐던 단어</label><textarea data-passage-note="${idx}-vocab"></textarea></div>
        </div>
      </div>
    </article>`).join("");
}
function renderQuestions() {
  $("questions").innerHTML = DATA.questions.map(q => `
    <article class="question-card" id="q-${q.number}" data-answer="${q.answer}">
      <div class="question-head"><span class="q-num">${q.number}번</span><span class="q-points">${q.points || 2}점</span><span class="result" id="result-${q.number}"></span></div>
      <div class="question-body">
        ${q.needsReview && q.needsReview.includes("diagram") ? `
          <div class="visual-warning" style="border-left: 4px solid #ea580c; background: #fff7ed; color: #c2410c; padding: 12px; border-radius: 8px;">
            ※ 이 문항은 그림/도식 확인이 필요합니다.
            <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;">
              <button class="secondary" style="padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 6px; background: #ea580c; color: #fff; border: none; font-weight: 800;" onclick="togglePdfView(${q.number})">화면에서 보기 / 접기</button>
              <a href="${DATA.submissionConfig?.googleDrivePdfUrl || "problem.pdf"}" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; padding: 6px 12px; font-size: 12px; border-radius: 6px; background: #334155; color: #fff; text-decoration: none; font-weight: 800;">새 탭에서 PDF 열기 (모바일 권장)</a>
            </div>
            <div id="pdf-view-${q.number}" style="display: none; margin-top: 10px; border: 1px solid #ffedd5; border-radius: 6px; overflow: hidden; height: 500px;">
              <iframe data-src=\"${DATA.submissionConfig?.googleDrivePdfUrl || 'problem.pdf'}${q.pdfPage ? '#page=' + q.pdfPage : ''}\" width="100%" height="100%" style="border: none;" src="about:blank"></iframe>
            </div>
          </div>` : ""}
        <div class="stem markable" data-highlight-id="q-${q.number}-stem">${applySectionLabels(applyUnderline(esc(q.stem)))}</div>
        ${q.hasView && q.view ? `<div class="view markable" data-highlight-id="q-${q.number}-view">${applySectionLabels(applyUnderline(esc(q.view)))}</div>` : ""}
        <ul class="choices">
          ${q.choices.map(c => `<li><label class="choice" data-q="${q.number}" data-choice="${c.number}"><input type="radio" name="q${q.number}" value="${c.number}"><span class="choice-text markable" data-highlight-id="q-${q.number}-choice-${c.number}"><b>${choiceSymbol(c.number)}</b> ${applySectionLabels(applyUnderline(esc(c.text)))}</span></label></li>`).join("")}
        </ul>
        <div class="explanation">
          <div class="exp-main">${prose(q.explanation?.main || "해설 확인 필요")}</div>
          ${[1,2,3,4,5].map(n => `<div class="exp-choice"><b>${choiceSymbol(n)}</b> ${prose(q.explanation?.choiceExplanations?.[String(n)] || "해설 확인 필요")}</div>`).join("")}
          <div class="note-grid">
            ${["선택한 이유","정답 근거","본문 근거","선생님께 질문"].map((label, idx) => `<div><label>${label}</label><textarea data-note="${q.number}-${idx}"></textarea></div>`).join("")}
          </div>
        </div>
      </div>
    </article>`).join("");
}
function collectState() {
  const answers = {};
  DATA.questions.forEach(q => { const checked = document.querySelector(`input[name="q${q.number}"]:checked`); answers[q.number] = checked ? Number(checked.value) : null; });
  const answerKey = {};
  const judgments = {};
  let correctCount = 0;
  let wrongCount = 0;
  let blankCount = 0;
  DATA.questions.forEach(q => {
    const selected = answers[q.number];
    const correct = Number(q.answer);
    const isBlank = selected === null || selected === undefined || selected === "";
    const isCorrect = !isBlank && Number(selected) === correct;
    answerKey[q.number] = correct;
    if (isBlank) blankCount++;
    else if (isCorrect) correctCount++;
    else wrongCount++;
    judgments[q.number] = { selected, correct, isCorrect, isBlank };
  });
  const notes = {};
  document.querySelectorAll("[data-note]").forEach(el => notes[el.dataset.note] = el.value);
  const passageReflections = DATA.passages.map((p, idx) => {
    const checked = document.querySelector(`input[data-passage-difficulty="${idx}"]:checked`);
    const entry = {
      label: p.label || "",
      title: p.title || "",
      difficulty: checked ? checked.value : "",
      notes: {}
    };
    document.querySelectorAll(`[data-passage-note^="${idx}-"]`).forEach(el => {
      entry.notes[el.dataset.passageNote.slice(String(idx).length + 1)] = el.value;
    });
    return entry;
  });
  const student = {
    name: $("studentName").value, class: $("studentClass").value,
    email: $("studentEmail").value, today: $("today").value
  };
  const totalPoints = DATA.questions.reduce((s, q) => s + (Number(q.points) || 2), 0);
  const earnedPoints = DATA.questions.reduce((s, q) => {
    const j = judgments[q.number];
    return s + (j && j.isCorrect ? (Number(q.points) || 2) : 0);
  }, 0);
  const scoreSummary = {
    totalCount: DATA.questions.length,
    correctCount,
    wrongCount,
    blankCount,
    totalPoints,
    earnedPoints,
    scoreRate: totalPoints ? Math.round((earnedPoints / totalPoints) * 100) : 0
  };
  const storedToken = localStorage.getItem(STORAGE_KEY + ":token") || "";
  return { meta: DATA.meta, student, answers, answerKey, scoreSummary, judgments, notes, highlights: collectHighlights(), passageReflections, token: storedToken, savedAt: new Date().toISOString() };
}
function saveStudentIdentity() {
  const name = $("studentName").value.trim();
  const cls  = $("studentClass").value.trim();
  const email = $("studentEmail").value.trim();
  if (name || cls || email) {
    try { localStorage.setItem("student:identity", JSON.stringify({ name, "class": cls, email })); } catch(_) {}
  }
}
function closestMarkable(node) {
  const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
  return el ? el.closest("[data-highlight-id]") : null;
}
function setHighlightColor(color) {
  currentHighlightColor = color || "yellow";
  document.querySelectorAll(".swatch").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.color === currentHighlightColor);
  });
}
document.addEventListener("click", function(e) {
  if (e.target.matches(".swatch")) setHighlightColor(e.target.dataset.color);
  if (e.target.matches("[data-quick-color]")) {
    e.preventDefault();
    setHighlightColor(e.target.dataset.quickColor);
    applyHighlight(savedHighlightRange);
    hideFloatingHighlight();
  }
});
function rememberSelection() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const box = closestMarkable(range.commonAncestorContainer);
  if (!box || !box.contains(range.startContainer) || !box.contains(range.endContainer)) return;
  savedHighlightRange = range.cloneRange();
  showFloatingHighlight(range);
}
function showFloatingHighlight(range) {
  const tool = $("floatingHighlight");
  if (!tool) return;
  const rect = range.getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)) return;
  tool.style.left = Math.max(8, Math.min(window.innerWidth - 180, rect.left + rect.width / 2 - 76)) + "px";
  tool.style.top = Math.max(8, rect.top - 46) + "px";
  tool.classList.add("visible");
}
function hideFloatingHighlight() {
  const tool = $("floatingHighlight");
  if (tool) tool.classList.remove("visible");
}
document.addEventListener("selectionchange", function() {
  setTimeout(rememberSelection, 80);
});
document.addEventListener("touchend", function() {
  setTimeout(rememberSelection, 180);
});
function applyHighlight(rangeOverride) {
  const sel = window.getSelection();
  const range = rangeOverride || (sel && sel.rangeCount ? sel.getRangeAt(0) : savedHighlightRange);
  if (!range || range.collapsed) return;
  const box = closestMarkable(range.commonAncestorContainer);
  if (!box || !box.contains(range.startContainer) || !box.contains(range.endContainer)) {
    alert("한 문단이나 한 선택지 안에서만 표시할 수 있습니다.");
    return;
  }
  const mark = document.createElement("mark");
  mark.className = "student-highlight";
  mark.dataset.highlightColor = currentHighlightColor;
  try {
    mark.appendChild(range.extractContents());
    range.insertNode(mark);
    if (sel) sel.removeAllRanges();
    savedHighlightRange = null;
    saveHighlights();
  } catch (err) {
    alert("선택한 범위는 표시하기 어렵습니다. 조금 더 짧게 선택해 주세요.");
  }
}
function unwrapMark(mark) {
  const parent = mark.parentNode;
  while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
  parent.removeChild(mark);
  parent.normalize();
}
function removeHighlightAtSelection() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const el = sel.anchorNode && (sel.anchorNode.nodeType === Node.ELEMENT_NODE ? sel.anchorNode : sel.anchorNode.parentElement);
  const mark = el ? el.closest("mark.student-highlight") : null;
  if (mark) {
    unwrapMark(mark);
    saveHighlights();
  }
}
function clearAllHighlights() {
  if (!confirm("모든 형광펜 표시를 지울까요?")) return;
  document.querySelectorAll("mark.student-highlight").forEach(unwrapMark);
  saveHighlights();
}
function collectHighlights() {
  const highlights = {};
  document.querySelectorAll("[data-highlight-id]").forEach(el => {
    if (el.querySelector("mark.student-highlight")) highlights[el.dataset.highlightId] = el.innerHTML;
  });
  return highlights;
}
function saveHighlights() {
  localStorage.setItem(HIGHLIGHT_KEY, JSON.stringify(collectHighlights()));
}
function applyStoredHighlights(highlights) {
  const saved = highlights || JSON.parse(localStorage.getItem(HIGHLIGHT_KEY) || "{}");
  Object.entries(saved).forEach(([id, html]) => {
    const el = document.querySelector(`[data-highlight-id="${CSS.escape(id)}"]`);
    if (el && typeof html === "string") el.innerHTML = html;
  });
}
function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); saveStudentIdentity(); alert("저장했습니다."); }
function loadFromLocal() {
  const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return;
  const s = JSON.parse(raw);
  $("studentName").value = s.student?.name || ""; $("studentClass").value = s.student?.class || "";
  $("studentEmail").value = s.student?.email || ""; $("today").value = s.student?.today || "";
  Object.entries(s.answers || {}).forEach(([q,v]) => { const el = document.querySelector(`input[name="q${q}"][value="${v}"]`); if (el) el.checked = true; });
  Object.entries(s.notes || {}).forEach(([k,v]) => { const el = document.querySelector(`[data-note="${k}"]`); if (el) el.value = v; });
  (s.passageReflections || []).forEach((entry, idx) => {
    if (entry.difficulty) {
      const el = document.querySelector(`input[data-passage-difficulty="${idx}"][value="${entry.difficulty}"]`);
      if (el) el.checked = true;
    }
    Object.entries(entry.notes || {}).forEach(([k,v]) => {
      const el = document.querySelector(`[data-passage-note="${idx}-${k}"]`);
      if (el) el.value = v;
    });
  });
  applyStoredHighlights(s.highlights || null);
}
function gradeExam() {
  let correct = 0, earned = 0, total = 0;
  DATA.questions.forEach(q => {
    const pts = Number(q.points) || 2;
    total += pts;
    const card = $(`q-${q.number}`); card.classList.add("graded");
    const checked = document.querySelector(`input[name="q${q.number}"]:checked`);
    const selected = checked ? Number(checked.value) : null;
    const isCorrect = selected === Number(q.answer);
    if (isCorrect) { correct++; earned += pts; }
    card.querySelectorAll(".choice").forEach(label => {
      const n = Number(label.dataset.choice);
      label.classList.toggle("correct", n === Number(q.answer));
      label.classList.toggle("wrong", selected === n && selected !== Number(q.answer));
    });
    $(`result-${q.number}`).textContent = isCorrect ? "정답" : `오답 (정답 ${choiceSymbol(q.answer)})`;
  });
  $("scorePanel").classList.add("visible");
  $("scoreNum").textContent = `${earned}점 / ${total}점`;
  $("scoreDetail").textContent = `정답 ${correct}개, 오답 ${DATA.questions.length - correct}개`;
  $("submitArea").classList.add("visible");
  saveToLocal();
}
function resetExam() { if (confirm("입력 내용을 초기화할까요?")) { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(HIGHLIGHT_KEY); location.reload(); } }
function downloadWrongnote() {
  const blob = new Blob([JSON.stringify(collectState(), null, 2)], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${DATA.meta.passageId}_wrongnote.json`; a.click(); URL.revokeObjectURL(a.href);
}
function loadPendingQueue() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch(_) { return []; }
}
function savePendingQueue(queue) {
  localStorage.setItem(PENDING_KEY, JSON.stringify(queue.slice(-5)));
}
function queueSubmission(payload, reason) {
  const queue = loadPendingQueue();
  queue.push({ payload, reason: String(reason || ""), queuedAt: new Date().toISOString() });
  savePendingQueue(queue);
}
function postSubmission(payload) {
  const url = DATA.submissionConfig?.googleScriptUrl;
  return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(res => res.json());
}
function retryPendingSubmissions(silent=true) {
  const url = DATA.submissionConfig?.googleScriptUrl;
  if (!url || url.includes("여기에_")) return Promise.resolve();
  const queue = loadPendingQueue();
  if (!queue.length) return Promise.resolve();
  const remaining = [];
  let chain = Promise.resolve();
  queue.forEach(item => {
    chain = chain.then(() => postSubmission(item.payload).then(res => {
      if (!res.ok) remaining.push(item);
    }).catch(() => remaining.push(item)));
  });
  return chain.then(() => {
    savePendingQueue(remaining);
    if (!silent && !remaining.length) $("submitStatus").textContent = "보관 중이던 제출까지 모두 전송했습니다.";
  });
}
function submitToTeacher() {
  const url = DATA.submissionConfig?.googleScriptUrl;
  if (!url || url.includes("여기에_")) { $("submitStatus").textContent = "제출 URL이 설정되지 않았습니다."; return; }
  const name = $("studentName").value.trim();
  if (!name) { $("submitStatus").textContent = "이름을 먼저 입력해 주세요."; return; }
  saveStudentIdentity();
  $("submitStatus").textContent = "전송 중...";
  
  const linkBox = $("teacherLinkBox");
  if (linkBox) linkBox.innerHTML = "";

  const payload = collectState();
  postSubmission(payload)
    .then(res => {
      if (res.ok) { 
        $("submitStatus").textContent = "✅ 선생님께 성공적으로 제출되었습니다!"; 
        retryPendingSubmissions(true);
        if (res.token) {
          localStorage.setItem(STORAGE_KEY + ":token", res.token);
        }
        if (res.studentFeedbackUrl) {
          if (linkBox) {
            linkBox.innerHTML = `<a href="${res.studentFeedbackUrl}" target="_blank" style="display:inline-block; margin-top:10px; padding:8px 16px; background-color:#11645d; color:#fff; text-decoration:none; border-radius:4px; font-weight:700;">내 피드백 확인 페이지 열기</a>`;
          }
        }
      }
      else { $("submitStatus").textContent = "❌ 제출 실패: " + (res.message || "알 수 없는 오류"); }
    })
    .catch(err => {
      queueSubmission(payload, err.message);
      $("submitStatus").textContent = "⚠️ 전송에 실패해 이 브라우저에 임시 보관했습니다. 인터넷 연결 후 다시 제출하면 자동으로 함께 전송됩니다. JSON 다운로드도 백업으로 보관하세요. (" + err.message + ")";
    });
}
function togglePdfView(qNum) {
  const el = document.getElementById("pdf-view-" + qNum);
  if (!el) return;
  const isHidden = el.style.display === "none";
  if (isHidden) {
    const iframe = el.querySelector("iframe");
    if (iframe && !iframe.dataset.loaded) {
      iframe.src = iframe.dataset.src;
      iframe.dataset.loaded = "true";
    }
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}
function init() {
  renderMeta(); renderPassages(); renderQuestions(); loadFromLocal(); applyStoredHighlights();
  try {
    const id = JSON.parse(localStorage.getItem("student:identity") || "null");
    if (id) {
      if (!$("studentName").value)  $("studentName").value  = id.name  || "";
      if (!$("studentClass").value) $("studentClass").value = id["class"] || "";
      if (!$("studentEmail").value) $("studentEmail").value = id.email || "";
    }
  } catch(_) {}
  retryPendingSubmissions(true);
}
init();
</script>
